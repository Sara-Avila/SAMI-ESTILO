<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMI ESTILO</title>
    <link rel="stylesheet" href="../login/style.css">
</head>

<body>
    <div class="contenedor"> 
        
    </div>


    <img src="/login/img/fondo.png" alt="Fondo">
    <main class="portada">

        <div class="logo">
            <span class="adorno-izquierdo"></span>

            <div class="circulo">
                <h1 class="iniciales">SM</h1>
            </div>

            <span class="adorno-derecho"></span>
            

            <p class="nombre-logo">SAMI ESTILO</p>
        </div>

        <button class="boton iniciar">
            INICIAR SESIÓN
        </button>

        <button class="boton registrar">
            REGISTRAR
        </button>

        <p class="slogan">
            “MODA QUE REFLEJA TU ESTILO”
        </p>

        <h2 class="titulo">SAMI ESTILO</h2>

        <button class="boton-red apple">
            Continuar con Apple
        </button>

        <button class="boton-red google">
            Continuar con Google
        </button>

        <button class="boton-red facebook">
            Continuar con Facebook
        </button>

    </main>
    <main class="registrarse">
        <div class="registro">
            <div class="logo">
                <span class="adorno-izquierdo"></span>

                <div class="circulo">
                    <h1 class="iniciales">SM</h1>
                </div>

                <span class="adorno-derecho"></span>

                <p class="nombre-logo">SAMI ESTILO</p>
            </div>
        </div>

        <h1 class="titulo">REGISTRATE</h1>
        <form class="formulario">
            <label for="nombre">NOMBRE DE USUARIO</label>
            <P></P>
            <input type="text" id="usuario" name="nombre" placeholder="Ingresa tu nombre" required>
            <p></p>
            <label for="correo">CORREO ELECTRÓNICO</label>
            <P></P>
            <input type="email" id="correoRegistro" name="correo" placeholder="Ingresa tu correo electrónico" required>
            <p></p>
            <label for="celular">NÚMERO DE CELULAR</label>
            <P></P>
            <input type="tel" id="celular" name="celular" placeholder="Ingresa tu número de celular" required>
            <p></p>
            <label for="contraseña">CONTRASEÑA</label>
            <P></P>
            <input type="password" id="contraseñaRegistro" name="contraseña" placeholder="Ingresa tu contraseña" required>

            <button type="submit">REGISTRAR</button>
            <p></p>
        </form>
        <p></p>
        
        
    </main>
    <main class="iniciar-sesion">
        <div class="logo">
            <span class="adorno-izquierdo"></span>

            <div class="circulo">
                <h1 class="iniciales">SM</h1>
            </div>

            <span class="adorno-derecho"></span>

            <p class="nombre-logo">SAMI ESTILO</p>
        </div>
        <h1 class="titulo">INICIAR SESIÓN</h1>
        <form class="formulario" id="inicio_sesion">
            <label for="correo">CORREO ELECTRÓNICO</label>
            <P></P>
            <input type="email" id="correologin" name="correo" placeholder="Ingresa tu correo electrónico" required>
            <p></p>
            <label for="contraseña">CONTRASEÑA</label>
            <P></P>
            <input type="password" id="contraseñalogin" name="contraseña" placeholder="Ingresa tu contraseña" required>
            <p></p>
        </form>
        <button type="submit">INICIAR SESIÓN</button>
        <p>
            <div class="h4">
            <h4>¿Olvidaste tu contraseña?</h4> <a href="#">Recuperar</a>
        </p>
        <p>
            <h4>¿No tienes una cuenta?</h4> <a href="#">Registrate</a>
        </p>
        </div>
    </main>

<script src="../login/scrip.js"></script></div>
</body>
</html>
